<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Notes Manager</title>
    <link rel="stylesheet" href="/SmartNotesManagmentSystem/css/style.css">
</head>
<script>
    // Back button disable karo
    window.history.pushState(null, '', window.location.href);
    window.onpopstate = function() {
        window.history.go(1);
    };
</script>
<body>

<div class="container">
    <h2>📝 Notes Management System</h2>
    <h3 style="text-align:center; color:#666; margin-bottom:20px;">Login</h3>

    <div id="msgBox"></div>

    <form action="/SmartNotesManagmentSystem/loginServlet" method="post">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter Email Id" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <div class="link">
        Account ? <a href= "/SmartNotesManagmentSystem/html/register.html">Register</a>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('msg') === 'invalid') {
        document.getElementById('msgBox').innerHTML = '<div class="msg-error">Invalid email or password!</div>';
    }
    if (params.get('msg') === 'registered') {
        document.getElementById('msgBox').innerHTML = '<div class="msg-success">Registration successful! Please login.</div>';
    }
    
    
 
    // Back button disable karo after logout
    window.history.pushState(null, null, window.location.href);
    window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
    };
</script>

</body>
</html>
