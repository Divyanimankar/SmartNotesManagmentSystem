<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <title>Notes Management System</title>
    <link rel="stylesheet" href="../css/style.css">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
</head>
<script>
    // Page load hotach session check karo
    fetch('/SmartNotesManagmentSystem/ViewNotesServlet', {
        method: 'GET',
        redirect: 'manual'
    }).then(function(res) {
        if (res.type === 'opaqueredirect' || res.status === 0 || res.status === 302) {
            window.location.replace('/SmartNotesManagmentSystem/html/login.html');
        }
    }).catch(function() {
        window.location.replace('/SmartNotesManagmentSystem/html/login.html');
    });

    // Back button disable karo
    window.history.pushState(null, '', window.location.href);
    window.history.pushState(null, '', window.location.href);
    window.history.pushState(null, '', window.location.href);
    window.onpopstate = function() {
        window.history.pushState(null, '', window.location.href);
        fetch('/SmartNotesManagmentSystem/ViewNotesServlet', {
            method: 'GET',
            redirect: 'manual'
        }).then(function(res) {
            if (res.type === 'opaqueredirect' || res.status === 0) {
                window.location.replace('/SmartNotesManagmentSystem/html/login.html');
            }
        });
    };
</script>
<body>

<div class="navbar">
    <h2>📝 Notes Management System</h2>
    <div>
        <a href="/SmartNotesManagmentSystem/ViewNotesServlet">My Notes</a>
       <a href="/SmartNotesManagmentSystem/html/dashboard.html">Dashboard</a>
      <!--    <a href="/SmartNotesManagmentSystem/ViewNotesServlet" class="btn">Logout</a> -->
      
      <a href="/SmartNotesManagmentSystem/LogoutServlet">Logout</a>
    </div>
</div>

<div style="text-align:center; margin-top:80px;">
    <h2 style="color:#2c3e50; font-size:32px;">Welcome</h2>
    <p style="color:#666; margin-top:15px; font-size:16px;">
        
    </p>

    <div style="display:flex; justify-content:center; gap:20px; margin-top:40px; flex-wrap:wrap;">

        <div style="background:white; padding:30px 40px; border-radius:12px; box-shadow:0 3px 15px rgba(0,0,0,0.1); width:200px;">
            <div style="font-size:40px;">📋</div>
            <h3 style="margin-top:10px; color:#2c3e50;">View Notes</h3>
            <a href= "/SmartNotesManagmentSystem/ViewNotesServlet" class="btn" style="display:block; margin-top:15px; width:auto; text-align:center; padding:8px; text-decoration:none;">View</a>
        </div>

        <div style="background:white; padding:30px 40px; border-radius:12px; box-shadow:0 3px 15px rgba(0,0,0,0.1); width:200px;">
            <div style="font-size:40px;">➕</div>
            <h3 style="margin-top:10px; color:#2c3e50;">Add Note</h3>
            <a href="addNote.html" class="btn" style="display:block; margin-top:15px; width:auto; text-align:center; padding:8px; text-decoration:none;">Add</a>
        </div>

    </div>
</div>

</body>
</html>
